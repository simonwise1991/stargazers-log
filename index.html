<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">A personal archive</p>
        <h1>Stargazers log</h1>
        <p class="intro">A log of the repositories I've starred.</p>
      </header>

      <section aria-labelledby="repositories-heading">
        <div class="list-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <p id="repository-count" class="count" aria-live="polite"></p>
        </div>
        <p id="list-status" class="status" role="status">Loading repositories...</p>
        <ol id="repository-list" class="repository-list"></ol>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
